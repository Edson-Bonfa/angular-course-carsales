<div class="grid justify-content-center card">
  <div class="col-10 sm:6 md:col-4">
    <p-card>
      <div class="grid">
        <div class="col-12 text-center">
          <i class="fa-solid fa-car fa-4x" style="color: #007ad9"></i>
          <h2>Car Sales</h2>
        </div>
        <div class="col-12">
          <label for="">Usuário:</label>
          <input
            [(ngModel)]="requestLogin.login"
            type="text"
            pInputText
            class="col-12"
          />
        </div>
        <div class="col-12">
          <label for="">Senha:</label>
          <input
            [(ngModel)]="requestLogin.password"
            type="password"
            pInputText
            class="col-12"
          />
        </div>
        <div class="col-12">
          <button
            (click)="doLogin()"
            class="col-12"
            style="
              color: white;
              background-color: blue;
              border: none;
              border-radius: 10px;
            "
          >
            Entrar
          </button>
        </div>
      </div>
    </p-card>
  </div>
</div>
